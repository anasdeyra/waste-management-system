# Test configuration: the tests always run against an in-memory database so that
# they never touch the local demonstration database.
spring:
  datasource:
    url: jdbc:h2:mem:wastems-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false

logging:
  level:
    com.ase.wastems: WARN
    org.hibernate: WARN
