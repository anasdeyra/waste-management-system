server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true

spring:
  profiles:
    default: dev        # dev seed accounts; tests override with @ActiveProfiles("test")
  application:
    name: wastems-backend
  datasource:
    # H2 in file mode (D-013): a local, dependency-free database.
    url: jdbc:h2:file:./data/wastems;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    com.ase.wastems: INFO
    com.graphhopper: WARN

wastems:
  # NYC bounding box; coordinates outside it (e.g. longitude/latitude swapped) are rejected (422).
  service-area:
    min-longitude: -74.30
    max-longitude: -73.65
    min-latitude: 40.45
    max-latitude: 40.95
  # Versioned OSM road snapshot and embedded GraphHopper (D-021, D-037, docs/geospatial-data.md §3.1).
  routing:
    osm-location: classpath:routing/mn01-roads.osm
    expected-sha256: e1f2fabaa937117f3a4c25582fb1ac4026fbb6fe8f3b9882f705e88a341d6a01
    version-prefix: osm-mn01-
    cache-dir: routing-cache          # relative to the working directory (backend/); git-ignored
    max-snap-distance-meters: 100
  # Three-method evaluation (D-008, D-015): service time per stop.
  optimization:
    service-time-seconds: 600
  # Seeded MN01 evaluation experiment (D-016, D-022, D-050); fixed vehicle capacity in kg.
  experiment:
    vehicle-capacity-kg: 10000
  # NYC DOT traffic overlay (US-34, D-021, D-050): committed timestamped snapshot, display only.
  traffic:
    snapshot-location: classpath:traffic/mn01-traffic-links.json
    stale-after-minutes: 15
    max-plausible-speed-mph: 100
  # Synthetic demonstration operations on the real MN01 data (US-33); enabled in dev only.
  demo:
    enabled: false
