server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true

spring:
  profiles:
    default: dev        # dev seed accounts; tests override with @ActiveProfiles("test")
  application:
    name: wastems-backend
  datasource:
    # H2 in file mode (D-013): a local, dependency-free database.
    url: jdbc:h2:file:./data/wastems;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    com.ase.wastems: INFO
